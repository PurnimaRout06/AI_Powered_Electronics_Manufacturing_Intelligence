server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve real files/assets directly; fall back to index.html for
    # everything else so React Router can handle client-side routes like
    # /equipment/EQ-004 on a full page load.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively; index.html itself is not
    # cached so deploys take effect immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
